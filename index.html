<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Market Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <button id="pause-btn" hidden aria-label="Pause game">II</button>
  <button id="notebook-btn" hidden aria-label="Open Notebook">Notebook</button>
  <div id="touch" hidden>
    <div id="stick" aria-label="Move"><div id="knob"></div></div>
    <button id="use-btn" aria-label="Use">Use</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
